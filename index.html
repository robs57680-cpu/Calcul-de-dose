<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Calcul de doses</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#14302d;--mut:#5d7572;--line:#d3e1de;--ac:#0f766e;--acs:#d8f0ec;--ok:#15803d;--oks:#dcf5e3;--ko:#b91c1c;--kos:#fde4e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1a;--card:#162826;--ink:#e3f1ee;--mut:#93b0ab;--line:#2a4440;--ac:#4fd1c0;--acs:#1c3b38;--ok:#6ee79a;--oks:#173a27;--ko:#ff8f8f;--kos:#431a1a}}
:root[data-theme="dark"]{--bg:#0e1b1a;--card:#162826;--ink:#e3f1ee;--mut:#93b0ab;--line:#2a4440;--ac:#4fd1c0;--acs:#1c3b38;--ok:#6ee79a;--oks:#173a27;--ko:#ff8f8f;--kos:#431a1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px}
.seg{display:flex;gap:6px;background:var(--acs);padding:4px;border-radius:12px;margin-bottom:18px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:9px 4px;border-radius:9px;font:inherit;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--bg);font-weight:700}
.th{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.th:hover,.th:focus-visible{border-color:var(--ac);outline:none}
.th .ic{font-size:1.5rem;width:40px;height:40px;display:grid;place-items:center;background:var(--acs);border-radius:10px;flex:none}
.th b{display:block}.th small{color:var(--mut)}
.th .bs{margin-left:auto;color:var(--ac);font-weight:700;font-size:.85rem;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--acs);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;font-size:1.1rem;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
input{flex:1;min-width:0;font:inherit;font-size:1.3rem;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--ac)}
.u{font-weight:700;color:var(--ac)}
.btn{width:100%;border:0;background:var(--ac);color:var(--bg);font:inherit;font-weight:700;padding:13px;border-radius:12px;cursor:pointer;margin-top:4px}
.btn.g{background:var(--acs);color:var(--ink)}
.fb{border-radius:12px;padding:14px;margin-bottom:12px}
.fb.ok{background:var(--oks);color:var(--ok)}.fb.ko{background:var(--kos);color:var(--ko)}
.fb ul{margin:8px 0 0;padding-left:20px;color:var(--ink)}
.big{font-size:3rem;font-weight:800;text-align:center;margin:10px 0 0;color:var(--ac)}
.er{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-size:.92rem}
.er span{color:var(--mut)}
.tl{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:0}

.ans{flex:1;min-height:54px;border:2px solid var(--ac);border-radius:10px;background:var(--card);font-size:1.5rem;padding:8px 12px;text-align:right;font-variant-numeric:tabular-nums}
.pad,.ck{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pad button,.ck button{font:inherit;font-size:1.3rem;padding:13px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.ck{grid-template-columns:repeat(4,1fr);gap:6px;margin:0}.ck button{padding:10px 0;font-size:1.1rem}.ck .op{background:var(--acs)}
#cb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:var(--bg);font-size:1.5rem;cursor:pointer;z-index:10;box-shadow:0 2px 8px #0004}
#cp{position:fixed;left:12px;right:12px;max-width:320px;margin-left:auto;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;z-index:10;display:none;box-shadow:0 4px 16px #0004}
#cp.on{display:block}
#cd{text-align:right;font-size:1.4rem;min-height:42px;padding:6px 8px;background:var(--bg);border-radius:8px;margin-bottom:8px;overflow-x:auto;white-space:nowrap}
.pts{display:flex;justify-content:space-between;align-items:center;background:var(--acs);border-radius:12px;padding:10px 14px;margin-bottom:14px;gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.mb{height:6px;background:var(--acs);border-radius:4px;margin-top:6px;overflow:hidden}.mb i{display:block;height:100%;background:var(--ac)}
.rw{opacity:.45}.rw.on{opacity:1}
h3{margin:18px 0 8px}
#app{padding-bottom:100px}
#up{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:536px;margin:0 auto;z-index:20;border:0;border-radius:12px;padding:12px;background:var(--ac);color:var(--bg);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 16px #0005}
#up[hidden]{display:none}
</style>
</head>
<body>
<button id="up" hidden>🔄 Nouvelle version disponible : mettre à jour</button>
<div id="app"></div>
<button id="cb" aria-label="Calculatrice">🧮</button>
<div id="cp"><div id="cd">0</div><div class="ck" id="ck"></div></div>
<script>
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[r(0,a.length-1)];
const f=n=>(+(+n).toFixed(2)).toLocaleString('fr-FR');
const G={};
G.dose=L=>{let v,c,d,ans,steps,q;
 if(L==1){const m=P([5,10,20,25,50]);v=P([2,5,10]);c=m*v;d=m*P([1,2,3,4]);ans=d/m;
  q=`Flacon de ${c} mg dans ${v} mL. Prescription : ${d} mg. Quel volume prélever ?`;
  steps=[`Concentration : ${c} mg ÷ ${v} mL = ${m} mg/mL`,`Volume : ${d} mg ÷ ${m} mg/mL = ${f(ans)} mL`]}
 else if(L==2){v=P([2,4,5,10]);c=P([40,80,100,250,500]);d=P([30,60,75,120,150,200,300]);const m=c/v;ans=d/m;
  q=`Ampoule de ${c} mg dans ${v} mL. Prescription : ${d} mg. Quel volume prélever ?`;
  steps=[`Concentration : ${c} ÷ ${v} = ${f(m)} mg/mL`,`Volume : ${d} ÷ ${f(m)} = ${f(ans)} mL`]}
 else if(r(0,1)){v=P([1,2,5]);const m=P([50,100,250]);c=m*v;const d=P([0.05,0.1,0.15,0.2,0.25,0.3]);ans=d*1000/m;
  q=`Ampoule de ${c} µg dans ${v} mL. Prescription : ${String(d).replace('.',',')} mg. Quel volume prélever ?`;
  steps=[`Conversion : ${f(d)} mg = ${f(d*1000)} µg`,`Concentration : ${c} ÷ ${v} = ${m} µg/mL`,`Volume : ${f(d*1000)} ÷ ${m} = ${f(ans)} mL`]}
 else{v=P([5,10]);c=P([500,1000,2000]);const m=c/v;const d=P([0.5,0.75,1,1.5,2]);ans=d*1000/m;
  q=`Flacon de ${c} mg dans ${v} mL. Prescription : ${String(d).replace('.',',')} g. Quel volume prélever ?`;
  steps=[`Conversion : ${f(d)} g = ${f(d*1000)} mg`,`Concentration : ${c} ÷ ${v} = ${f(m)} mg/mL`,`Volume : ${f(d*1000)} ÷ ${f(m)} = ${f(ans)} mL`]}
 return{q,ans,unit:'mL',dec:2,steps}};
G.debit=L=>{let V,t,q,steps,tt;
 if(L==1){V=P([250,500,1000]);t=P([2,4,5,10]);tt=t;q=`Perfusion de ${V} mL à passer en ${t} h.`}
 else if(L==2){V=P([100,150,250,500,750,1000,1500]);t=P([3,6,8,12,24]);tt=t;q=`Perfusion de ${V} mL à passer en ${t} h.`}
 else{V=P([100,250,500,750,1000]);const h=r(1,4),m=P([15,30,45]);tt=h+m/60;t=`${h} h ${m} min`;q=`Perfusion de ${V} mL à passer en ${t}.`}
 const ans=V/tt;steps=L==3?[`Durée : ${t} = ${f(tt)} h`,`Débit : ${V} ÷ ${f(tt)} = ${f(ans)} mL/h`]:[`Débit : ${V} mL ÷ ${t} h = ${f(ans)} mL/h`];
 return{q:q+' Quel débit en mL/h ?',ans,unit:'mL/h',dec:1,steps}};
G.gouttes=L=>{let V,t,fc,ans,q,steps;
 if(L==1){fc=20;V=P([250,500,1000]);t=P([2,4,5,6,8,10]);ans=V*fc/(t*60);
  q=`Perfusion de ${V} mL en ${t} h, tubulure de ${fc} gouttes/mL. Quel débit en gouttes/min ?`;
  steps=[`Gouttes totales : ${V} × ${fc} = ${V*fc}`,`Minutes : ${t} × 60 = ${t*60}`,`Débit : ${V*fc} ÷ ${t*60} = ${f(ans)} gouttes/min`]}
 else if(L==2||r(0,1)){fc=P([15,20,60]);V=P([100,250,500,750,1000]);t=P([2,3,4,6,8,12]);ans=V*fc/(t*60);
  q=`Perfusion de ${V} mL en ${t} h, tubulure de ${fc} gouttes/mL. Quel débit en gouttes/min ?`;
  steps=[`Gouttes totales : ${V} × ${fc} = ${V*fc}`,`Minutes : ${t} × 60 = ${t*60}`,`Débit : ${V*fc} ÷ ${t*60} = ${f(ans)} gouttes/min`]}
 else{fc=P([15,20,60]);const d=P([40,60,80,125,150,200]);ans=d*fc/60;
  q=`Débit prescrit : ${d} mL/h, tubulure de ${fc} gouttes/mL. Quel débit en gouttes/min ?`;
  steps=[`Gouttes par heure : ${d} × ${fc} = ${d*fc}`,`Par minute : ${d*fc} ÷ 60 = ${f(ans)} gouttes/min`]}
 return{q,ans,unit:'gouttes/min',dec:0,steps}};
G.pct=L=>{let q,ans,unit,dec=1,steps;
 if(L==1){const p=P([1,2,5,10]),V=P([2,5,10,20]);ans=p*10*V;unit='mg';
  q=`Combien de mg de produit actif dans ${V} mL d'une solution à ${p} % ?`;
  steps=[`${p} % = ${p} g/100 mL = ${p*10} mg/mL`,`Quantité : ${p*10} × ${V} = ${ans} mg`]}
 else if(L==2){const p=P([0.5,1,2]),m=p*10,d=m*P([0.5,1,1.5,2,2.5,3,4,5]);ans=d/m;unit='mL';
  q=`Solution à ${String(p).replace('.',',')} %. Prescription : ${f(d)} mg. Quel volume injecter ?`;
  steps=[`${f(p)} % = ${f(m)} mg/mL`,`Volume : ${f(d)} ÷ ${f(m)} = ${f(ans)} mL`]}
 else if(r(0,1)){const V=P([50,100,250,500]),p=P([0.9,2.5,5,10,20]);const m=p*V/100;ans=p;unit='%';
  q=`Poche de ${V} mL contenant ${f(m)} g de soluté. Quel est le pourcentage (g/100 mL) ?`;
  steps=[`Pour 100 mL : ${f(m)} × 100 ÷ ${V} = ${f(ans)} g`,`Soit ${f(ans)} %`]}
 else{const mm=P([5,10,20,40,25]);ans=mm/10;unit='%';
  q=`Une solution contient ${mm} mg/mL. Quel est son pourcentage ?`;
  steps=[`${mm} mg/mL = ${mm} g/L`,`1 % = 10 g/L, donc ${mm} ÷ 10 = ${f(ans)} %`]}
 return{q,ans,unit,dec,steps}};
G.poids=L=>{let q,ans,unit,steps;
 if(L==1){const d=P([5,10,15,20]),p=P([50,60,70,80]);ans=d*p;unit='mg';
  q=`Prescription : ${d} mg/kg. Patient de ${p} kg. Quelle dose totale ?`;steps=[`${d} × ${p} = ${ans} mg`]}
 else if(L==2){const p=P([8,12,15,20,25]),d=P([30,40,50,60,100]),n=P([2,3,4]);ans=d*p/n;unit='mg';
  q=`Enfant de ${p} kg, prescription ${d} mg/kg/jour en ${n} prises. Quelle dose par prise ?`;
  steps=[`Dose par jour : ${d} × ${p} = ${d*p} mg`,`Par prise : ${d*p} ÷ ${n} = ${f(ans)} mg`]}
 else{const p=P([10,12,15,20,25]),d=P([30,40,50,60]),n=P([2,3,4]),c=P([20,25,40,50]);ans=d*p/n/c;unit='mL';
  q=`Enfant de ${p} kg, ${d} mg/kg/jour en ${n} prises. Sirop à ${c} mg/mL. Quel volume par prise ?`;
  steps=[`Dose par jour : ${d} × ${p} = ${d*p} mg`,`Par prise : ${d*p} ÷ ${n} = ${f(d*p/n)} mg`,`Volume : ${f(d*p/n)} ÷ ${c} = ${f(ans)} mL`]}
 return{q,ans,unit,dec:1,steps}};
G.seringue=L=>{let q,ans,steps;
 if(L==1){const c=P([1,2,5,10]),x=c*P([1,2,3,4,5]);ans=x/c;
  q=`Seringue électrique à ${c} mg/mL. Prescription : ${x} mg/h. Quel débit en mL/h ?`;steps=[`${x} mg/h ÷ ${c} mg/mL = ${f(ans)} mL/h`]}
 else if(L==2){const X=P([50,100,250,500]),c=X/50,x=P([2,5,8,10,15,20]);ans=x/c;
  q=`Seringue de 50 mL contenant ${X} mg de produit. Prescription : ${x} mg/h. Quel débit en mL/h ?`;
  steps=[`Concentration : ${X} ÷ 50 = ${f(c)} mg/mL`,`Débit : ${x} ÷ ${f(c)} = ${f(ans)} mL/h`]}
 else{const w=P([60,70,80,90]),d=P([2,3,5,10]),X=P([250,500]),c=X*1000/50;ans=d*w*60/c;
  q=`Patient de ${w} kg, prescription ${d} µg/kg/min. Seringue de 50 mL contenant ${X} mg. Quel débit en mL/h ?`;
  steps=[`Concentration : ${X} mg = ${X*1000} µg dans 50 mL = ${c} µg/mL`,`Dose/min : ${d} × ${w} = ${d*w} µg/min, soit ${d*w*60} µg/h`,`Débit : ${d*w*60} ÷ ${c} = ${f(ans)} mL/h`]}
 return{q,ans,unit:'mL/h',dec:1,steps}};
const TH=[
 {id:'dose',n:'Dose et volume à prélever',d:'mg, µg, g → mL',i:'💉'},
 {id:'debit',n:'Débit en mL/h',d:'Volume et durée',i:'💧'},
 {id:'gouttes',n:'Gouttes par minute',d:'Tubulures 15, 20 ou 60 gouttes/mL',i:'⏱️'},
 {id:'pct',n:'Pourcentages',d:'% de produit actif, mg/mL',i:'🧪'},
 {id:'poids',n:'Dose selon le poids',d:'mg/kg, pédiatrie, sirops',i:'⚖️'},
 {id:'seringue',n:'Seringue électrique',d:'mg/h, µg/kg/min → mL/h',i:'🩺'},
 {id:'mixte',n:'Série mixte',d:'Tous les thèmes mélangés',i:'🎲'}];
const LV=['Niveau 1','Niveau 2','Niveau 3'],N=10;
const gen=(id,L)=>{const k=id=='mixte'?P(Object.keys(G)):id,q=G[k](L);q.cat=k;return q};
const today=()=>new Date().toLocaleDateString('sv');
const REW=[[100,'🌱','Stagiaire motivée'],[300,'⭐','Rigueur en progrès'],[600,'🏅','Calculs fiables'],[1000,'🎖️','Experte des doses'],[2000,'🏆','Infirmière en or']];
let S={lvl:1,th:null,qs:[],i:0,sc:0,st:'q',errs:[],gain:0,val:'',view:'home'};
let D={best:{},pts:0,earned:[],th:{},days:{},dr:[]};
try{const x=JSON.parse(localStorage.getItem('dosecalc2')||'null');if(x)D=Object.assign(D,x);else D.best=JSON.parse(localStorage.getItem('dosecalc')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('dosecalc2',JSON.stringify(D))}catch(e){}};
const dv=()=>D.days[today()]||{n:0,ok:0,s:0};
const day=()=>D.days[today()]||(D.days[today()]={n:0,ok:0,s:0});
const pc=(a,b)=>b?Math.round(a/b*100)+' %':'–';
const app=document.getElementById('app');
function home(){S.view='home';const d=dv();
 app.innerHTML=`<h1>Calcul de doses</h1><div class="pts"><span>⭐ <b>${D.pts}</b> pts</span><span>Aujourd’hui : ${d.s}/5 séries</span><button class="tl" id="st" style="color:var(--ac);font-weight:700">📊 Stats</button></div>
 <p class="sub">Choisis un niveau, puis un thème : 10 calculs tirés au hasard.</p>
 <div class="seg">${LV.map((l,i)=>`<button class="${S.lvl==i+1?'on':''}" data-l="${i+1}">${l}</button>`).join('')}</div>
 ${TH.map(t=>{const b=D.best[t.id+S.lvl];return`<button class="th" data-t="${t.id}"><span class="ic">${t.i}</span><span><b>${t.n}</b><small>${t.d}</small></span>${b!=null?`<span class="bs">${b}/${N}</span>`:''}</button>`}).join('')}`;
 document.getElementById('st').onclick=stats;chkUI();
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lvl=+b.dataset.l;home()});
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>start(b.dataset.t));
}
function stats(){S.view='stats';const d=dv(),got=D.dr.includes(today());
 const days=Object.keys(D.days).filter(k=>D.days[k].n>0).sort().slice(-7).reverse();
 app.innerHTML=`<div class="top"><button class="tl" id="m">← Menu</button><span></span><span>⭐ ${D.pts} pts</span></div><h1>Statistiques</h1>
 <h3>Aujourd’hui</h3><div class="st"><b>${d.s}/5 séries</b> · ${d.ok}/${d.n} bonnes réponses (${pc(d.ok,d.n)})<div class="mb"><i style="width:${Math.min(d.s,5)*20}%"></i></div><div class="sub" style="margin:6px 0 0">${got?'🔥 Récompense du jour obtenue !':'Objectif : 5 séries avec au moins 90 % de réussite sur la journée.'}</div></div>
 <h3>Par catégorie</h3>${TH.filter(t=>t.id!='mixte').map(t=>{const s=D.th[t.id]||{n:0,ok:0};return`<div class="st">${t.i} <b>${t.n}</b><br>${s.ok}/${s.n} bonnes réponses · <b>${pc(s.ok,s.n)}</b><div class="mb"><i style="width:${s.n?s.ok/s.n*100:0}%"></i></div></div>`}).join('')}
 <h3>Récompenses</h3>${REW.map(([p,i,n])=>`<div class="st rw ${D.earned.includes(p)?'on':''}">${i} <b>${n}</b> <span class="sub">${p} pts</span></div>`).join('')}
 <div class="st rw ${D.dr.length?'on':''}">🔥 <b>Journée parfaite</b> <span class="sub">× ${D.dr.length} · +50 pts à chaque fois</span></div>
 <h3>Derniers jours</h3>${days.map(k=>{const x=D.days[k];return`<div class="st">${new Date(k+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})} : ${x.s} séries · <b>${pc(x.ok,x.n)}</b> de réussite</div>`}).join('')||'<p class="sub">Aucune série pour l’instant.</p>'}`;
 document.getElementById('m').onclick=home;
}
function start(id){S.th=id;S.qs=Array.from({length:N},()=>gen(id,S.lvl));S.i=0;S.sc=0;S.gain=0;S.errs=[];S.st='q';quiz()}
function quiz(){S.view='quiz';S.val='';S.st='q';
 const q=S.qs[S.i],t=TH.find(x=>x.id==S.th);
 app.innerHTML=`<div class="top"><button class="tl" id="m">← Menu</button><span>${t.n} · ${LV[S.lvl-1]}</span><span>${S.i+1}/${N}</span></div>
 <div class="bar"><i style="width:${S.i/N*100}%"></i></div>
 <div class="q">${q.q}</div>
 <div class="row"><div class="ans" id="a"></div><span class="u">${q.unit}</span></div>
 <div id="res"></div>
 <div class="pad">${['7','8','9','4','5','6','1','2','3',',','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>
 <button class="btn" id="go">Valider</button>`;
 document.getElementById('m').onclick=home;
 document.getElementById('go').onclick=act;
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
 show();
}
const show=()=>{const a=document.getElementById('a');if(a)a.textContent=S.val||'\u00a0'};
function key(k){if(S.view!='quiz'||S.st!='q')return;
 if(k=='⌫')S.val=S.val.slice(0,-1);
 else if(k==','){if(!S.val.includes(','))S.val+=S.val?',':'0,'}
 else if(S.val.length<9)S.val+=k;
 show()}
function act(){S.st=='q'?check():next()}
function check(){
 if(!S.val||S.val=='0,')return;
 const v=parseFloat(S.val.replace(',','.')),q=S.qs[S.i],L=S.lvl;
 const tol=Math.max(0.5*Math.pow(10,-q.dec),0.01*q.ans),ok=Math.abs(v-q.ans)<=tol;
 const delta=ok?10*L:-5*L,b=D.pts;D.pts=Math.max(0,D.pts+delta);S.gain+=D.pts-b;
 const s=D.th[q.cat]||(D.th[q.cat]={n:0,ok:0});s.n++;const d=day();d.n++;
 if(ok){S.sc++;s.ok++;d.ok++}else S.errs.push({q:q.q,v:f(v)+' '+q.unit,a:f(q.ans)+' '+q.unit});
 save();S.st='n';
 document.getElementById('res').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'Bonne réponse ! +'+10*L:'Attendu : '+f(q.ans)+' '+q.unit+' · −'+5*L} pts</b><ul>${q.steps.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 document.getElementById('go').textContent=S.i==N-1?'Voir mon score':'Question suivante';
}
function next(){S.i++;S.i<N?quiz():end()}
function end(){S.view='end';
 const k=S.th+S.lvl;if(D.best[k]==null||S.sc>D.best[k])D.best[k]=S.sc;
 const d=day();d.s++;const nr=[];
 if(d.s>=5&&d.ok/d.n>=.9&&!D.dr.includes(today())){D.dr.push(today());D.pts+=50;nr.push('🔥 Journée parfaite : +50 pts')}
 REW.forEach(([p,i,n])=>{if(D.pts>=p&&!D.earned.includes(p)){D.earned.push(p);nr.push(`${i} ${n}`)}});
 save();
 const msg=S.sc==N?'Sans faute !':S.sc>=8?'Très bien !':S.sc>=5?'Continue, ça vient.':'Refais une série pour t’entraîner.';
 app.innerHTML=`<h1>Série terminée</h1><div class="big">${S.sc}/${N}</div><p class="sub" style="text-align:center">${msg}<br>Série : <b>${S.gain>=0?'+':''}${S.gain} pts</b> · Total : <b>${D.pts} pts</b> · Aujourd’hui ${d.s}/5 séries (${pc(d.ok,d.n)})</p>
 ${nr.map(x=>`<div class="fb ok"><b>Récompense débloquée : ${x}</b></div>`).join('')}
 ${S.errs.length?`<h3>À revoir</h3>${S.errs.map(e=>`<div class="er">${e.q}<br><span>Ta réponse : ${e.v}</span> · Attendu : <b>${e.a}</b></div>`).join('')}`:''}
 <button class="btn" id="re">Nouvelle série</button><button class="btn g" id="mn">Changer de thème</button><button class="btn g" id="sx">📊 Statistiques</button>`;
 document.getElementById('re').onclick=()=>start(S.th);document.getElementById('mn').onclick=home;document.getElementById('sx').onclick=stats;
}
document.addEventListener('keydown',e=>{
 if(S.view!='quiz'||document.getElementById('cp').classList.contains('on'))return;
 if(e.key=='Enter'){e.preventDefault();act()}
 else if(/^\d$/.test(e.key))key(e.key);
 else if(e.key==','||e.key=='.')key(',');
 else if(e.key=='Backspace')key('⌫');
});
/* Calculatrice */
function ev(s){let p=0;const t=s.replace(/\s/g,'');
 const num=()=>{if(t[p]=='('){p++;const v=ex();if(t[p]!=')')throw 0;p++;return v}const m=/^(\d+\.?\d*|\.\d+)/.exec(t.slice(p));if(!m)throw 0;p+=m[0].length;return parseFloat(m[0])};
 const un=()=>{if(t[p]=='-'){p++;return -un()}return num()};
 const tm=()=>{let v=un();while(t[p]=='*'||t[p]=='/'){const o=t[p++],w=un();v=o=='*'?v*w:v/w}return v};
 const ex=()=>{let v=tm();while(t[p]=='+'||t[p]=='-'){const o=t[p++],w=tm();v=o=='+'?v+w:v-w}return v};
 const v=ex();if(p<t.length)throw 0;return v}
let ce='',cr=false;const cd=document.getElementById('cd');
function ckey(k){
 if(k=='C')ce='';else if(k=='⌫')ce=ce=='Erreur'?'':ce.slice(0,-1);
 else if(k=='='){try{const v=ev(ce.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/,/g,'.'));if(!isFinite(v))throw 0;ce=(+v.toFixed(6)).toString().replace('.',',');cr=true}catch(e){ce='Erreur'}}
 else{if(ce=='Erreur'||(cr&&/[\d,(]/.test(k)))ce='';cr=false;ce+=k}
 cd.textContent=ce||'0'}
document.getElementById('ck').innerHTML=['C','⌫','÷','×','7','8','9','−','4','5','6','+','1','2','3','=','0',',','(',')'].map(k=>`<button data-c="${k}" class="${/[C⌫÷×−+=]/.test(k)?'op':''}">${k}</button>`).join('');
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>ckey(b.dataset.c));
document.getElementById('cb').onclick=()=>document.getElementById('cp').classList.toggle('on');
/* Mise à jour (service worker) */
let REG=null;const upBtn=document.getElementById('up');
function showUp(w){upBtn.hidden=false;upBtn.onclick=()=>{upBtn.textContent='Mise à jour…';w.postMessage('SKIP_WAITING')}}
function chkUI(){app.insertAdjacentHTML('beforeend','<div style="text-align:center;margin-top:18px"><button class="tl" id="cu">🔄 Vérifier les mises à jour</button><div class="sub" id="cus" style="margin:6px 0 0;font-size:.85rem"></div></div>');
 document.getElementById('cu').onclick=async()=>{const m=document.getElementById('cus');if(!REG){m.textContent='Disponible uniquement sur la version hébergée.';return}m.textContent='Recherche…';
  try{await REG.update();setTimeout(()=>{m.textContent=REG.waiting?'Nouvelle version prête : appuie sur le bouton en haut.':'Tu as déjà la dernière version.'},800)}catch(e){m.textContent='Impossible de vérifier (hors ligne ?).'}}}
if('serviceWorker' in navigator){
 const had=!!navigator.serviceWorker.controller;let rl=false;
 navigator.serviceWorker.register('./sw.js').then(reg=>{REG=reg;
  if(reg.waiting&&navigator.serviceWorker.controller)showUp(reg.waiting);
  reg.addEventListener('updatefound',()=>{const n=reg.installing;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)showUp(n)})});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
 }).catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||rl)return;rl=true;location.reload()});
}
home();
</script>
